  # Dashboard surface
  - id: dashboard-list
    surface: dashboard
    contract: |
      Implementation: the dashboard SPA is built with Vite from
      `dashboard/web/src/routes/CommentsList.tsx` and served by the
      Cloudflare Worker via Workers Static Assets (binding declared in
      `dashboard/wrangler.toml`). The list route consumes SDS primitives
      (Button, Tag, Input, etc.) from the vendored copy at
      `dashboard/web/src/sds/`; the sidebar tabs are an intentional
      deviation rendered as native `<button class="tab">` (see
      `dashboard-sidebar-tabs-are-native`).

      Login by project token (stored in localStorage). Sidebar tabs
      Open/Resolved with counts. The tab strip remains binary: Open buckets
      `open` + `in-progress`, Resolved buckets `resolved` + `wont-fix`.
      The list runs on a single fetch (no `?status=` filter) and buckets
      client-side, so tab counts and contents always agree on the same
      snapshot. Each row shows truncated change text, site-wide tag, anon-id
      (first 6 chars), timestamp, page URL pathname (display-only span — click
      the row to enter detail; the linkable URL lives in the detail panel), and a status pill (one of four
      colour classes). Rows whose status is `resolved` or `wont-fix` get
      the `is-closed` class for greyout (rendered via the runtime
      `isClosedStatus()` helper, single source of truth).

      A controls row above the list provides:
        - Search input — case-insensitive substring filter over change_text,
          why_text, and url. Empty query = no filter. Placeholder reads
          "Search N comments…" where N is the visible count.
        - Sort select — three options: newest (default), oldest, unresolved
          first. Selection persists per-user via localStorage key `fp_sort`
          (shared with widget and wrapper sidebars).

      Page grouping: when the visible (post search/filter/sort) comment set
      spans more than one distinct page URL, render collapsible group
      headers, one per page, in first-seen order within the sorted list.
      Pin numbering is global across groups so numbers remain stable as a
      user collapses sections. Single-page projects render flat.
      Group default state is expanded; collapse state is held in component
      state and not persisted.

      Three empty states: "No comments yet", "No comments in this view.",
      and `No comments matching "<q>"`.
