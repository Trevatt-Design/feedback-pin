# feedback-pin manifest — the single source of truth.
#
# Owned by the integrator agent at the end of every fp-feature run.
# Do not edit by hand except to (a) revise strategy, (b) add an anti-feature,
# (c) record a deliberate strategic pivot. Anything else goes through fp-feature.

strategy:
  north_star: "In-situ feedback that survives layout changes and produces structured input for designers."
  audiences:
    - id: commenter
      role: "End client leaving feedback on a page they didn't build"
      primary_surface: widget
    - id: reviewing-designer
      role: "Designer triaging feedback during a review session"
      primary_surface: wrapper
    - id: designer-buyer
      role: "Designer evaluating feedback-pin to use on their projects"
      primary_surface: dashboard
  phase: wireframe-as-code
  ui_vocabulary: |
    Figma's Simple Design System (SDS) is the canonical UI vocabulary for
    every surface. The dashboard consumes SDS primitives directly from the
    vendored copy at `dashboard/web/src/sds/`; the widget consumes SDS at
    the token level via `widget/src/tokens.ts` (scoped to `:host` for
    shadow-DOM isolation). Ad-hoc styling outside this vocabulary — bespoke
    component CSS that doesn't reach for an SDS token, primitive, or
    documented deviation — is not permitted. New surfaces start by reaching
    for an SDS primitive; deviations require a manifest invariant explaining
    why.

# ─── Anti-features ────────────────────────────────────────────────────────────
# Any brief that triggers one of these returns to the user as a conflict.
anti-features:
  - id: af-cms-edit
    statement: "Auto-edit the host site's DOM or content"
    rationale: "Edit was the original idea that made the product too complex; comment-first is the wedge"
  - id: af-accounts
    statement: "Per-user accounts and authentication for commenters"
    rationale: "Anon-id is sufficient for v1; account systems delay shipping"
  - id: af-ai-auto-edit
    statement: "AI mutating the host site's DOM, content, or styles directly"
    rationale: "AI is allowed for inference and clarification of intent at capture time, but never for changing the host site"
  - id: af-brand-polish
    statement: "No decoration beyond what SDS ships. No custom illustration. No motion beyond what SDS conventions imply."
    rationale: "SDS is the canonical UI vocabulary in this phase; bespoke decoration, custom illustration, and gratuitous motion drift the surface away from the design system and create maintenance burden the wireframe-as-code phase explicitly defers. Brand pass — if and when it happens — lands as a deliberate strategic pivot, not as ad-hoc polish baked into individual features."
  - id: af-i18n
    statement: "Internationalisation and localisation"
    rationale: "Out of scope for v1; English-only is fine"
  - id: af-realtime-collab
    statement: "Real-time collaborative cursors / presence indicators"
    rationale: "Comments and replies are async; presence is later if needed"

# ─── Features ─────────────────────────────────────────────────────────────────
features:
  # Widget surface
  - id: widget-mode-toggle
    surface: widget
    contract: |
      Two modes: comment (default), browse. C key toggles. Mode is mirrored
      to the wrapper via postMessage.

      Cursor behaviour: the OS cursor stays default in both modes (no CSS
      `cursor: url(...)` override). In Comment mode a small floating badge
      is rendered alongside the cursor as a mode indicator. The badge has
      three lifecycle stages:

        follow  — Default in Comment mode while no panel is open. The badge
                  follows mousemove with a `+14, +14` offset (bottom-right
                  of the cursor). Hidden while the cursor is over widget
                  chrome (toggle, sidebar) so it doesn't compete with those
                  controls.

        snap    — When the composer opens (a target was clicked), the badge
                  transitions (~180ms) from its last cursor position to a
                  fixed point at the top-left of the composer panel,
                  straddling the border. It sits there for the entire
                  composing flow, signalling "this comment lives here".

        hidden  — When an existing-comment thread is open (the existing pin
                  already marks the anchor), or when Browse mode is active.

      On comment submission, the badge fades out over ~150ms while the new
      `.fp-pin` renders at the element's anchor (different position, so
      it's a cross-fade rather than a position morph). Visual continuity
      is the shape and colour: same filled blue circle, white interior,
      "+" sign while it's a badge, comment number once it becomes a pin.
    invariants:
      - default-mode-is-comment-on-load
      - c-key-toggles-when-no-input-focused
      - os-cursor-not-overridden-in-comment-mode
      - comment-mode-renders-badge-following-cursor
      - badge-snaps-to-composer-on-open
      - badge-hides-on-thread-open
      - badge-fades-out-on-submit
      - badge-hides-while-cursor-over-widget-chrome
      - cursor-badge-remains-custom-consumes-sds-brand-token-only
    tests:
      - tests/e2e/cursor-badge.spec.ts
    conflicts-with: []

  - id: widget-composer
    surface: widget
    contract: |
      Click an element to open a minimal composer near it. The sticky highlight
      on the selected element is the only chrome confirming the target — no
      header, no title, no close button, no step indicator.

      When the composer opens, a "spotlight" overlay also activates: a fixed-
      position element painted over the entire viewport via a 9999px box-
      shadow spread, with its rect set to the target's bounding box so the
      target stays bright while the rest of the page dims (~45% black).
      Widget chrome (mode toggle, sidebar, pins, composer panel) renders
      above the spotlight in document order, so it stays visible on top.

      The hover highlight (during target picking) is outline-only — a 2px
      coloured stroke, no fill, no halo — so it reads as a hover indicator
      without flooding the host page tone. The sticky highlight on the
      selected target is also outline-only; the spotlight provides the
      "selected" visual emphasis instead of a fill.

      Any text or icon rendered on a solid highlight-colour background uses
      `#fff` (white). The blue is too dark for `#1a1a1a` text at the size
      of pins, tags, and count badges. This applies across all surfaces.

      Steps:
        Step 1 — placeholder "Add comment". Submit affordance is a small
                 right-arrow inside a rounded-rectangle button at the bottom
                 right of the textarea. Advances to step 2.
        Step 2 — previous answer rendered above as inline-editable text (no
                 label; placeholder reappears only when the field is emptied).
                 Current input is "Why?" with right-arrow (when step 3 will
                 follow) or up-arrow (when this is the last input).
        Clarify (optional, AI-driven) — single question + 2-3 option pills,
                 only shown when /v1/inference returns confidence < 0.7.
        Step 3 — scope picker (only shown when cohort > 1 OR the style-target
                 is a style anchor). Previous answers shown above as inline-
                 editable text. Two scope buttons rendered side by side:
                 "This instance" (default, on) and "Site-wide". No question
                 label above them.

      Keyboard: Enter in either textarea submits/advances. Shift+Enter inserts
      a newline. Cmd/Ctrl+Enter is also accepted as a familiar alias.

      Both Comment and Why are mandatory. All previous answers in any step
      are inline-editable: clicking the rendered text turns it into an
      editable field; blur saves the edit into composer state.

      Dismissal:
        - Empty composer: any click outside the panel OR a single Esc dismisses
          silently. "Empty" means no text in any field, including the live,
          uncommitted textarea on the current step.
        - Non-empty composer: first click outside (or first Esc) shakes the
          panel; second click outside (or second Esc) dismisses. Shake state
          resets after ~4s of no further attempt.

      Style target = the only prominent style-anchor descendant if the clicked
      element wraps exactly one (h1-h6, p, button, a, li); otherwise the
      clicked element. Cohort signature = tag + first 1-2 meaningful
      (non-utility) classes.
    invariants:
      - no-close-button-renders
      - no-title-bar-renders
      - no-step-dots
      - both-fields-mandatory
      - sticky-highlight-stays-while-composing
      - hover-highlight-is-outline-only-no-fill
      - non-target-content-dimmed-via-spotlight-overlay-while-composing
      - text-on-highlight-background-is-white
      - native-checkbox-must-not-render
      - empty-clickaway-dismisses-silently
      - textful-clickaway-shakes-then-dismisses-on-second
      - shake-warning-fires-from-any-step-with-uncommitted-text
      - esc-mirrors-clickaway-semantics
      - previous-answers-shown-as-editable-text-without-labels
      - submit-arrow-inline-and-direction-matches-context
      - submit-button-is-rounded-rectangle-not-circle
      - enter-submits-shift-enter-inserts-newline
      - scope-step-only-shown-when-cohort-greater-than-1-or-style-anchor
      - scope-buttons-are-this-instance-and-site-wide-side-by-side
      - no-apply-to-label-on-scope-step
      - scope-button-click-saves-comment
      - style-target-prefers-single-style-anchor-descendant
      - outline-only-highlight-consumes-sds-color-tokens-only-geometry-preserved
      - spotlight-overlay-consumes-sds-color-tokens-only-opacity-preserved
      - submit-button-radius-mapped-to-sds-radius-200
    tests:
      - tests/unit/cohort.test.ts
      - tests/e2e/composer.spec.ts
    conflicts-with: []

  - id: widget-pins
    surface: widget
    contract: |
      Each comment renders a numbered pin anchored to its element. Resolution
      priority: stable selector → DOM path → coordinate fallback. Pin stays
      anchored across scroll and most layout changes. Click a pin to open
      its thread. Pins for comments whose status is `resolved` or `wont-fix`
      get the `is-closed` CSS class for greyout (rendered via the runtime
      `isClosedStatus()` helper, so the bucket is the single source of truth).

      Thread is a two-mode state machine:

        view (default — always entered first; opening a different thread
              always resets to view): read-only display of Comment, Why, and
              (only when site_wide is true) "Apply to: Site-wide". The top
              action row holds a Status `<select>` listing all four states
              (Open / In progress / Won't fix / Resolved); for the author,
              it also holds an Edit (pencil) button and a Delete (trash)
              button. Replies thread renders below; reply input is available.

        edit (entered by the author clicking Edit): the top action row
              changes to a Cancel + Save pair. The Status select, Delete
              button, replies, and reply input are hidden. The body becomes
              a form with two textareas (Comment, Why), pre-filled with the
              current values, and a checkbox labelled "Site-wide". Each
              field is wrapped in a `<label>` so the entire field area
              (label + input box) is one click target. Cancel returns to
              view (discarding edits). Save PATCHes the comment via the API
              and returns to view.

      Edit and Delete are gated to the author (anon-id match). Non-authors
      see only the Status select in the top row.

      Click outside the panel dismisses; closing also resets the thread back
      to view mode for the next open.
    invariants:
      - pin-anchors-via-selector-when-unique
      - pin-falls-back-to-coords-when-anchor-lost
      - pin-renumbers-stably-by-creation-order
      - thread-actions-at-top
      - thread-opens-in-view-mode-by-default
      - no-text-fields-contenteditable-in-view-mode
      - edit-button-renders-only-for-author
      - edit-and-delete-gated-to-author
      - edit-mode-renders-cancel-and-save
      - edit-mode-site-wide-is-checkbox
      - edit-form-fields-are-fully-clickable-via-label-wrapper
      - closing-thread-resets-mode-to-view
      - thread-top-action-is-status-select-with-four-options
      - closed-bucket-includes-resolved-and-wont-fix-for-greyout-and-tabs
    tests:
      - tests/e2e/thread-view-edit.spec.ts
      - tests/e2e/triage-statuses.spec.ts
    conflicts-with: []

  - id: widget-sidebar-standalone
    surface: widget
    contract: |
      When the widget is NOT in an iframe (auto-detected via window.self !== window.top),
      a right-edge sidebar lists comments with filter tabs (Open / Resolved / All).
      The Open tab buckets `open` + `in-progress`; the Resolved tab buckets
      `resolved` + `wont-fix`. Each row displays a compact status pill (one
      of four colour classes — `fp-status-open`, `fp-status-in-progress`,
      `fp-status-wont-fix`, `fp-status-resolved`) and gets the `is-closed`
      class for greyout when the status is `resolved` or `wont-fix`.
      Per-row toggle button has been removed; status changes happen in the
      thread top-row `<select>` instead. Per-item hover actions: edit own
      (matching anon-id), delete own. Click row to open thread + scroll
      element into view. The sidebar is hidden in headless mode.

      A controls row above the list provides:
        - Search input — case-insensitive substring filter over change_text,
          why_text, and url. Empty query = no filter. Placeholder reads
          "Search N comments…" where N is the visible count.
        - Sort select — three options: newest (default), oldest, unresolved
          first. Selection persists per-user via localStorage key `fp_sort`.
          Corrupt or unknown stored values fall back to newest.

      Three empty states:
        - "No comments yet" when the project has zero comments.
        - "No comments in this view." when the tab filter hides all.
        - `No comments matching "<q>"` when search returns nothing.
    invariants:
      - sidebar-rendered-only-in-standalone-context
      - edit-and-delete-only-on-own-comments
      - search-filters-by-change-why-and-url-substring
      - sort-options-newest-oldest-unresolved-first
      - sort-preference-persists-in-localstorage
      - corrupt-stored-sort-pref-falls-back-to-newest
      - closed-bucket-includes-resolved-and-wont-fix-for-greyout-and-tabs
    tests:
      - tests/unit/sort-search.test.ts
      - tests/e2e/sidebar-triage.spec.ts
      - tests/e2e/triage-statuses.spec.ts
    conflicts-with: []

  - id: widget-headless-mode
    surface: widget
    contract: |
      Auto-detect iframe context; do not render own toggle or sidebar.
      Listen for postMessage from the parent: fp:wrapper-hello (go headless),
      fp:set-mode (apply mode), fp:open-comment (scroll + open thread),
      fp:request-state (reply). Post fp:widget-ready, fp:mode-changed,
      fp:count, fp:comments to the parent.
    invariants:
      - headless-suppresses-toggle-and-sidebar
      - postmessage-protocol-types-match-wrapper
    tests: []
    conflicts-with: []

  - id: widget-screenshot-capture
    surface: widget
    contract: |
      On comment submit, capture a viewport screenshot (white background, scroll-
      offset cropped) using html2canvas-pro. Skip the widget host element via the
      ignoreElements predicate. Best-effort: if capture fails, screenshot_key is
      null and the comment still saves.
    invariants:
      - capture-failure-must-not-block-comment-save
      - widget-host-must-not-appear-in-capture
    tests: []
    conflicts-with: []

  - id: widget-anon-id
    surface: widget
    contract: |
      A localStorage-persisted anonymous unique id (prefix u_, 16 random bytes
      hex) is sent on every create/edit/delete via the x-fp-uid header.
      Edit and delete actions match the original anon-id only.
    invariants:
      - anon-id-persists-per-browser
      - edit-delete-gated-to-author
    tests: []
    conflicts-with: []

  - id: widget-keyboard
    surface: widget
    contract: |
      C toggles modes (when no input focused). Esc twice within ~700ms cancels
      composer or exits Comment mode. Enter in a composer textarea submits or
      advances; Shift+Enter inserts a newline. Cmd/Ctrl+Enter is accepted as a
      familiar alias for Enter.
    invariants:
      - c-ignored-while-typing
      - double-esc-required-not-single
      - enter-advances-step-and-submits
      - shift-enter-inserts-newline
    tests:
      - tests/e2e/composer.spec.ts
    conflicts-with: []

  # API surface
  - id: api-comments-crud
    surface: api
    contract: |
      Routes:
        POST   /v1/comments               create (project token + optional anon-id)
        GET    /v1/comments               list (filters: status, url)
        GET    /v1/comments/:id           detail with replies
        PATCH  /v1/comments/:id           edit own (anon-id must match)
        DELETE /v1/comments/:id           delete own (anon-id must match)
        POST   /v1/comments/:id/replies   reply
        POST   /v1/comments/:id/status    set status (body: { status })
        POST   /v1/comments/:id/resolve   resolve (legacy wrapper for status=resolved)
        POST   /v1/comments/:id/reopen    reopen  (legacy wrapper for status=open)
      All require Bearer token; anon-owned actions also require x-fp-uid.

      Status enum: 'open' | 'in-progress' | 'wont-fix' | 'resolved'. The
      /status route accepts any of the four and rejects others with 400.
      Legacy /resolve and /reopen routes are preserved as thin wrappers that
      delegate to the same shared status-setter, so existing widget builds
      keep working. Status changes are NOT author-gated — any project-token
      holder can triage any comment.
    invariants:
      - create-requires-non-empty-change-and-why
      - patch-rejects-non-author-with-403
      - delete-rejects-non-author-with-403
      - origin-allowlist-enforced-when-set
      - max-comment-bytes-enforced
      - status-enum-allows-open-in-progress-wont-fix-resolved
      - status-route-accepts-all-four-and-rejects-others-with-400
      - legacy-resolve-reopen-routes-still-work-and-route-through-status-handler
      - status-change-is-not-author-gated
    tests:
      - tests/api/status.test.ts
    conflicts-with: []

  - id: api-screenshots
    surface: api
    contract: |
      POST /v1/screenshots — image upload, returns a key prefixed with project_id/.
      GET  /v1/screenshots/:key — serves the image if key starts with project_id/.
      Public read mirror at /v1/public/screenshots/:key?share=TOKEN.
    invariants:
      - screenshot-key-must-be-project-prefixed
      - cross-project-read-rejected-with-403
    tests: []
    conflicts-with: []

  - id: api-inference-endpoint
    surface: api
    contract: |
      POST /v1/inference — given a comment + element context, returns an
      AI-generated suggestion of intent: refined target description, scope
      recommendation (single | cohort | global), confidence (0-1), optional
      clarification question with multiple-choice options.

      Auth: project token (Bearer).
      Body: { comment, why?, target: { tag, classes, text, description },
              cohortCount, isStyleAnchor, surroundingContext? }
      Response: { refined_target?: string, scope: "single"|"cohort"|"global",
                  confidence: number, clarification?: { question: string, options: string[] } }

      Backed by Anthropic Claude Haiku via env.ANTHROPIC_API_KEY (Worker secret).
      If the key is missing, the endpoint returns 503 with { error: "ai_unavailable" }
      so the widget can fall back to its heuristic flow without breaking.
    invariants:
      - returns-503-when-anthropic-key-missing
      - response-is-strict-json-with-known-shape
      - no-ai-call-when-comment-empty
    tests: []
    conflicts-with: []

  - id: widget-ai-inference
    surface: widget
    contract: |
      Between step 2 (why) and the scope decision, the widget POSTs to
      /v1/inference. If the response includes a clarification with
      confidence < 0.7, a clarification step appears: a single question
      with two or three option buttons. Picking an option records the
      answer and proceeds to scope (or saves directly if AI says "single"
      with high confidence). On 503 ai_unavailable, fall back to the
      heuristic flow silently. AI is best-effort; never blocks save.
    invariants:
      - clarification-shown-only-when-confidence-low
      - inference-failure-must-not-block-save
      - clarification-answer-saved-with-comment
    tests: []
    conflicts-with: []

  - id: api-public-share
    surface: api
    contract: |
      Routes under /v1/public/* keyed by ?share=<share_token>. Read-only.
      Returns project name, prefixed screenshots, and only the comments that
      are still actively in the triage funnel — `status IN ('open','in-progress')`.
      `wont-fix` and `resolved` comments are deliberately invisible to share
      visitors.
    invariants:
      - share-routes-never-allow-write
      - share-routes-expose-open-and-in-progress-only
    tests:
      - tests/api/status.test.ts
    conflicts-with: []

  # Wrapper surface (lives on dashboard worker at /review)
  - id: wrapper-toolbar
    surface: wrapper
    contract: |
      Top toolbar with two clusters separated by a flex spacer:

        Left cluster:  project name, target URL, segmented Comment/Browse
                       mode toggle.
        Right cluster: viewport controls row (device-class glyph switcher
                       + numeric width input + presets dropdown), Share
                       button, Hide-comments button with open count badge.

      The viewport controls row replaces the old three-button Desktop/Tablet/
      Mobile segmented control with three composable controls:

        - DeviceSeg     — two-button glyph cluster (desktop + mobile only;
                          tablet lives only as a preset optgroup).
                          `aria-pressed` reflects which class the current
                          {w, h} resolves to. Desktop click = fill canvas;
                          Mobile click = last-used mobile width or 390×844.
        - WidthInput    — numeric `<input type="number">`, `aria-label`
                          "Frame width in pixels", debounced 250ms with a
                          local-state-with-effect-guard pattern so the caret
                          stays at the end mid-type. On blur/commit, values
                          outside [320, 2560] revert to the last good width
                          and surface an inline absolute-positioned error
                          ("Width must be 320–2560") below the input.
                          Empty input → fill-canvas (debounced).
        - PresetSelect  — `<select>` with three `<optgroup>`s (Mobile /
                          Tablet / Desktop), a "Fill canvas" option, and a
                          hidden "__custom" sentinel that becomes the
                          selected option when the current {w, h} doesn't
                          match any preset.

      Mode toggle here is the source of truth and mirrored to the iframe via
      postMessage. Viewport, share, and hide live together because they are
      all "session controls" — adjustments to how the user is reviewing the
      page rather than what they're reviewing.

      Right-cluster buttons (Share, Hide-comments) reserve a stable footprint
      via `.btn-toolbar` (min-width 180px, content centred) so label changes
      ("Hide comments" ⇄ "Show comments", "Share" ⇄ "Copied!") and count-
      badge digit width changes do not reflow neighbouring controls. The
      count badge itself has min-width 22px for the same reason.

      Visual treatment migrated to SDS tokens (colours, spacing, typography,
      radii) via the per-iframe `<style>` block injected from
      `dashboard/worker/reviewHtml.ts`. The `min-width: 180px` on
      `.btn-toolbar` is retained as a raw layout value — it is a load-bearing
      anti-reflow guard, not a token.
    invariants:
      - mode-segmented-control-present-in-toolbar
      - viewport-controls-present-glyph-width-input-and-presets-dropdown
      - viewport-glyph-switcher-toggles-desktop-fill-and-mobile-default
      - viewport-segment-rendered-in-right-cluster-after-spacer
      - count-badge-reflects-open-comments
      - toolbar-button-widths-stable-across-state-toggles
    tests:
      - tests/e2e/viewport-controls.spec.ts
      - tests/e2e/wrapper.spec.ts
    conflicts-with: []

  - id: wrapper-iframe
    surface: wrapper
    contract: |
      Loads ?url=<target> in an iframe whose size is parameterised by
      `?w=NNN[&h=NNN]` URL params. Width is clamped to [320, 2560] both
      on input and on URL read; height to [240, 4096]. When `w` (or
      equivalently `viewport=mobile|tablet`) is set, the iframe renders at
      that pixel width with the corresponding height. When `w` is unset (or
      `viewport=desktop`), the iframe fills the canvas via the `.is-desktop`
      class (`position: absolute; inset: 16px`).

      Legacy `?viewport=desktop|tablet|mobile` aliases still resolve on read
      for back-compat with old share links. Concrete preset sizes (e.g.
      tablet 820×1180, mobile 390×844, iPhone 14 Pro Max 430×932) are
      surface choices in the toolbar's PresetSelect, not part of the iframe
      contract.

      On iframe load, wrapper sends fp:wrapper-hello and fp:set-mode.
    invariants:
      - desktop-iframe-fills-canvas
      - desktop-iframe-fills-canvas-only-when-fill-canvas-preset-is-chosen
      - iframe-renders-at-width-w-px-when-w-param-is-set
      - legacy-viewport-aliases-desktop-tablet-mobile-still-resolve-correctly
      - width-clamped-to-320-to-2560-on-input-and-on-read
    tests:
      - tests/e2e/viewport-controls.spec.ts
    conflicts-with: []

  - id: wrapper-sidebar
    surface: wrapper
    contract: |
      Right-side comments list, filterable (Open/Resolved/All). The Open tab
      buckets `open` + `in-progress`; the Resolved tab buckets `resolved` +
      `wont-fix`. Each row displays a compact status pill (one of four
      colour classes) and gets the `is-closed` class for greyout when the
      status is `resolved` or `wont-fix`. Click an item to set ?open=<id>
      in the URL and post fp:open-comment to the iframe. Polls comments
      every 3s.

      Layout: the sidebar is positioned absolutely over the canvas (right
      edge, 360px wide) and slides in/out via a transform — the iframe
      canvas dimensions never change when the sidebar is toggled. This is
      load-bearing for the widget composer modal: a fixed-position modal
      inside the iframe must stay anchored to its element when the user
      toggles the sidebar, and any iframe reflow would break that anchor.

      A controls row above the list provides:
        - Search input — case-insensitive substring filter over change_text,
          why_text, and url. Empty query = no filter. Placeholder reads
          "Search N comments…" where N is the visible count.
        - Sort select — three options: newest (default), oldest, unresolved
          first. Selection persists per-user via localStorage key `fp_sort`
          (shared with the widget standalone sidebar and dashboard list).

      Three empty states: "No comments yet", "No comments in this view.",
      and `No comments matching "<q>"`. Page grouping is NOT used here —
      the wrapper is URL-scoped to one target page at a time.
    invariants:
      - sidebar-overlays-canvas-without-reflowing-iframe
      - click-row-updates-url-and-posts-message
      - filter-tabs-match-status
      - search-filters-by-change-why-and-url-substring
      - sort-options-newest-oldest-unresolved-first
      - sort-preference-persists-in-localstorage
