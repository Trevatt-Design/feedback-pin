  # Cross-cutting design-system feature: SDS as the canonical UI vocabulary.
  # Adopted 2026-05-01. See decisions/2026-05.log and
  # reports/2026-05-01-design-system-sds.md.
  - id: design-system-sds
    surface: cross-cutting
    contract: |
      Figma's Simple Design System (SDS) is the canonical UI vocabulary for
      every surface in feedback-pin. The upstream is open source under MIT
      (https://github.com/figma/sds) and is vendored into this repo at
      `dashboard/web/src/sds/` from commit `be440d804c525a0d5654900161988edbe9754575`.
      Provenance — upstream commit SHA, retrieval date, and exact vendored
      file list — is recorded in `dashboard/web/src/sds/PROVENANCE.md`; the
      MIT licence is preserved verbatim at `dashboard/web/src/sds/LICENSE`.

      Dashboard:
        Built as a Vite SPA from `dashboard/web/` and served by a slim
        Cloudflare Worker via Workers Static Assets (binding declared in
        `dashboard/wrangler.toml`, with `run_worker_first = true` so
        `/review` and `/health` reach the worker before the SPA fallback).
        The SPA imports SDS primitives directly from the vendored copy
        (`dashboard/web/src/sds/ui/primitives/...`) for buttons, inputs,
        tags, textareas, etc. There are two documented native deviations:
        the comments-list sidebar tabs are native `<button class="tab">`
        (RAC autogenerated ids contain `:` and fail axe `aria-valid-attr-
        value`), and the detail-view Status control is a native `<select>`
        so the Playwright e2e can read its `<option>` values directly. No
        CDN React in the SPA — the `/review` wrapper is the documented
        exception (it still loads React via esm.sh per the original plan).
        Bundle budget enforced at build time: JS gzipped ≤ 200 kB, CSS
        gzipped ≤ 100 kB (`dashboard/web/scripts/check-bundle.mjs`).
        Fonts are self-hosted via `@fontsource/inter` + `@fontsource/roboto-mono`
        (no Google Fonts).

      Widget:
        Stays vanilla TypeScript inside a shadow root (no React, no
        react-aria-components). Consumes SDS at the **token** level via
        `widget/src/tokens.ts`, which mirrors `dashboard/web/src/sds/theme.css`
        but scopes every selector to `:host` so SDS variables don't leak
        onto the host page. `widget/src/styles.ts` references the SDS
        token chain (`var(--sds-...)`) for colours, radii, and shadows.
        A guard script (`widget/scripts/check-no-cross-import.mjs`) runs
        as the widget `prebuild` step to ensure the widget never imports
        from `dashboard/web/src/`.

      Per-surface deviations remain custom by design and are individually
      documented as invariants below: cursor-badge geometry, outline-only
      highlight geometry, spotlight overlay rgba opacity, and the submit
      button radius mapped to `--sds-size-radius-200`.

      CSP:
        `dashboard/worker/index.ts` injects a strict CSP on SPA HTML
        (`script-src 'self'`) and a relaxed CSP on `/review` only
        (`script-src 'self' 'unsafe-inline' https://esm.sh; connect-src
        'self' <api> https://esm.sh`) so the inline-module wrapper and its
        esm.sh imports keep working without weakening the SPA.
    invariants:
      - sds-vendored-mit-license-shipped
      - dashboard-built-from-sds-primitives
      - dashboard-status-select-is-native
      - dashboard-sidebar-tabs-are-native
      - widget-styles-sourced-from-sds-tokens
      - no-cdn-react-in-dashboard-spa
      - wrangler-serves-vite-built-assets
      - dashboard-bundle-budget
      - widget-does-not-import-dashboard-sds
      - dashboard-csp-strict-on-spa-relaxed-on-review
      - cursor-badge-remains-custom-consumes-sds-brand-token-only
      - outline-only-highlight-consumes-sds-color-tokens-only-geometry-preserved
      - spotlight-overlay-consumes-sds-color-tokens-only-opacity-preserved
      - submit-button-radius-mapped-to-sds-radius-200
      - dashboard-icon-button-wrapper-emits-aria-label-and-title
      - widget-fonts-load-from-system-stack-only
      - dashboard-fonts-self-hosted-via-fontsource-not-google
    tests:
      - tests/e2e/dashboard-sds-render.spec.ts
      - tests/unit/sds-contracts.test.ts
    conflicts-with: []

  # Cross-cutting "rules" that apply to every surface, not a single component.
  # Treated as a feature so they live alongside other contracts and have a
  # single, citable id when an invariant needs to be referenced from a PR.
  - id: universal-rules
    surface: cross-cutting
    contract: |
      Rules that apply to every surface in feedback-pin (widget, wrapper,
      dashboard) regardless of the component.

      Tooltips on icon-only buttons:
        Any <button> whose visible text content is empty (the only child is
        an icon, an SVG, or otherwise non-textual) MUST carry a `title`
        attribute. This is independent of `aria-label` (which serves screen
        readers) — `title` is the visible mouseover tooltip the user expects
        when they hover an icon button to learn what it does. The simplest
        way to keep the two in sync is to set them to the same string, but
        a shorter `title` is fine.
    invariants:
      - icon-only-buttons-have-title-attribute
    tests:
      - tests/e2e/thread-view-edit.spec.ts
    conflicts-with: []

# ─── Roadmap ──────────────────────────────────────────────────────────────────
# Queued briefs the autonomous loop pulls from.
#
# Usage: append entries here, then run `/loop /fp-next`. The fp-next skill
# (`.claude/skills/fp-next/SKILL.md`) picks the lowest-priority `status: queued`
# entry, marks it in-progress, and hands the brief to fp-feature. On success
# the integrator flips it to `done`; on any halt it stays in-progress with a
# `halt_note:` for the user to resolve.
#
# Schema:
#   id          required, unique, format r-YYYY-MM-DD-NN
#   title       required, short label
#   priority    required, integer; lower = higher priority
#   status      required: queued | in-progress | done
#   queued_on   required, YYYY-MM-DD
#   brief       required, multi-line; same format you would type to fp-feature
#   weight      optional: lightweight | full (auto-classified if absent)
#   notes       optional, free text
#   started_on  written by fp-next when work begins
#   shipped_on  written by fp-next on success
#   halt_note   written by fp-next on any halt
#
# Items with `status: done` are pruned by fp-next after 14 days.
#
# Template (uncomment and edit):
# roadmap:
#   - id: r-2026-05-05-01
#     title: Inline pin replies in dashboard sidebar
#     priority: 10
#     status: queued
#     queued_on: 2026-05-05
#     brief: |
#       Allow a viewer to reply to a pin from the dashboard sidebar
#       without opening the pin detail panel. Same auth model as
#       comments. Reuses the existing reply endpoint; only the UI
#       affordance is new. Sidebar row gains a reply textarea on click.
#     weight: standard
#   - id: r-2026-05-05-02
#     title: Resolve-all keyboard shortcut on dashboard list
#     priority: 20
#     status: queued
#     queued_on: 2026-05-05
#     brief: |
#       Add a keyboard shortcut (e.g. shift+R) on the dashboard list
#       that resolves every comment in the currently visible group.
#       Confirmation dialog before bulk action; undo within 5s via toast.
#     weight: lightweight
roadmap: []

