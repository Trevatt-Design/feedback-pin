# invariants.map.yaml — maps manifest invariant names to source locations.
#
# Owned by the integrator agent (Stage 7) — appended to whenever a new
# invariant is added to manifest.yaml. The Stage 0 drift check verifies
# that every entry here still resolves: the file exists and the named
# line is present.
#
# Backfilling is gradual: a missing entry is NOT a hard failure during the
# transition window. Once an invariant has an entry here, it MUST stay
# accurate — moving the code requires updating this file in the same
# commit.
#
# Entry schema:
#   <invariant-name>:
#     at: "<path/from/repo/root>:<line-number>"      # file:line, primary anchor
#     enforced_by: "test:<test-file-path>" | "code"  # what proves it
#     notes: "<optional one-liner>"
#
# Example:
#   default-mode-is-comment-on-load:
#     at: "widget/src/ui.ts:122"
#     enforced_by: "code"
#     notes: "Constructor reads opts.defaultMode || 'comment'"

invariants:
  default-mode-is-comment-on-load:
