# followups.yaml — open deferred items + interim-decision review queue.
#
# Owned by the integrator agent (Stage 7). Read by the orchestrator at
# Stage 1 so related items are surfaced when a new brief lands in the
# same area.
#
# Entry schema:
#   - id: short-kebab-id        # unique within this file
#     opened_on: YYYY-MM-DD
#     kind: deferred_fix         # one of: deferred_fix | interim_review | drift_repair | doc_drift
#                                # deferred_fix    = a known-good fix the pipeline didn't ship this batch
#                                # interim_review  = a decision marked "interim/temporary"; revisit at review_after
#                                # drift_repair    = manifest is stale relative to code (caught by drift check)
#                                # doc_drift       = docs reference outdated info
#     severity: low | medium | high
#     summary: "One sentence describing the issue."
#     blocked_on: <free text>    # what's stopping us from doing it now (or null)
#     originating_batch: <report path or "manual">
#     review_after: YYYY-MM-DD   # only for kind: interim_review; integrator sets ~90 days out
#     fix_one_liner: "..."       # optional; if the fix is one line of code, drop it here so future batches can pick it up cheaply
#
# Closing an item: delete the entry. The decisions log captures the close
# event ("closed followup XYZ — fixed in batch ABC").

followups:
  - id: dashboard-stub-regex-bare-path
    opened_on: 2026-04-30
    kind: deferred_fix
    severity: medium
    summary: |
      Dashboard's `api("/v1/comments")` (no query string) escapes the test
      stub in tests/e2e/sidebar-triage.spec.ts because the regex requires
      `?` after `comments`. f1/f2 silently hit the real D1 once data
      accumulates; we work around by clearing D1 manually each test run.
    blocked_on: null
    originating_batch: reports/2026-04-30-batch-d-view-edit-tooltips.md
    fix_one_liner: |
      Update the regex in stubDashboardApi (around tests/e2e/sidebar-triage.spec.ts:349) from
      "/v1/comments\\?.*" to "/v1/comments(\\?.*)?$" so it also catches the bare path.

  - id: smoke-test-port-drift
    opened_on: 2026-04-29
    kind: doc_drift
    severity: low
    summary: |
      smoke-test/README.md and the footer in smoke-test/index.html both
      reference the dashboard at :8788, but the actual dashboard worker
      runs on :8789 (matches playwright.config.ts).
    blocked_on: user-declined-for-now
    originating_batch: manual
    fix_one_liner: |
      sed -i '' 's|localhost:8788|localhost:8789|g' smoke-test/README.md smoke-test/index.html

