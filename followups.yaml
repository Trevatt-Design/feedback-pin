    blocked_on: null
    originating_batch: reports/2026-05-01-design-system-sds.md
    fix_one_liner: |
      Already mitigated by retries: 1 in playwright.config.ts. Real fix is
      to investigate the debounce-vs-Playwright timing in reviewHtml.ts
