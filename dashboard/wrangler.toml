name = "feedback-pin-dashboard"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Public URL of the API worker (no trailing slash)
API_URL = "http://localhost:8787"

# Workers Static Assets binding. The Vite SPA is built into web/dist and
# bound here as `ASSETS`. `not_found_handling = "single-page-application"`
# routes deep paths back to index.html so hash-routing keeps working under
# refresh. `run_worker_first = true` is required so the Worker sees
# /health and /review BEFORE the SPA fallback intercepts (Stage 3 amendment).
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
